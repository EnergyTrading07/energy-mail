# Prüft jeden Stand, bevor er in main landet.
#
# Bisher liefen die Prüfungen nur, wenn jemand sie von Hand startete - beim
# Veröffentlichen sicherte nichts ab. Jetzt läuft dasselbe, was lokal läuft, bei jedem
# Push: Typen, Bau, Prüfungen.
name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  # Damit sich der Lauf auch von Hand anstoßen lässt, ohne eigens etwas zu ändern.
  workflow_dispatch:

# Ein zweiter Push macht den ersten Lauf überflüssig - er wird abgebrochen, statt die
# Warteschlange zu belegen.
concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    # Windows, weil die Anwendung dorthin ausgeliefert wird. Auf Linux liefe manches
    # anders (Pfadtrenner, Groß- und Kleinschreibung von Dateinamen), und dann prüfte
    # der Lauf etwas, das so niemand benutzt.
    runs-on: windows-latest
    # Großzügiger als vorher (20): seit der Lauf zusätzlich das Paket baut und dafür die
    # Electron-Binärdatei lädt, dauert er ein paar Minuten länger.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # An Electron gekoppelt, nicht an die neueste Node-Fassung.
          #
          # Vorher stand hier 24. Electron bringt aber sein eigenes Node mit, und
          # node:sqlite - die Grundlage der lokalen Ablage, der Volltextsuche und des
          # Offline-Betriebs - hat sich zwischen den Fassungen in Verhalten und
          # Schnittstelle verändert. Die Prüfungen liefen damit unter einem anderen Node
          # als die ausgelieferte Anwendung: die CI sicherte genau das nicht ab, wofür
          # sie da ist.
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten holen
        run: npm ci
        env:
          # Spart rund hundert Megabyte und eine Minute: die Prüfungen brauchen die
          # Electron-Binärdatei nicht, nur ihre Typangaben - und die stecken im Paket.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typen
        run: npm run typecheck

      # Vor dem Bau, und das ist keine Sortierfrage: Der Prüfer braucht ein paar Sekunden,
      # der Bau ein Vielfaches davon. Wer eine vergessene Abhängigkeit in einem useEffect
      # hat, soll das erfahren, bevor die CI zwei Minuten lang etwas baut, das ohnehin
      # verworfen wird.
      #
      # Was er beanstandet, steht in eslint.config.js - bewusst wenig, dafür jedes davon
      # ein echter Befund.
      - name: Prüfer
        run: npm run lint

      - name: Bau
        # Getrennt vom Typcheck: Vite wirft Typen weg und baut auch dann, wenn welche
        # nicht stimmen. Umgekehrt findet der Typcheck keine Fehler in der Bauwerkstatt.
        run: npm run build

      - name: Prüfungen
        run: npm test

      # Ohne diesen Schritt fiele keine einzige gemeldete Lücke auf. Die Abhängigkeiten
      # dieses Programms - imapflow, mailparser, nodemailer, openpgp, fastify -
      # verarbeiten sämtlich Eingaben aus dem Netz, denen nicht zu trauen ist.
      #
      # Bricht den Lauf ab: eine hohe Lücke im Sendeweg oder in der Anzeige fremden HTMLs
      # ist kein Hinweis, den man wegklickt.
      - name: Abhängigkeiten auf Lücken prüfen
        run: npm audit --audit-level=high

      # Für das Paketieren wird die Electron-Binärdatei doch gebraucht - beim Holen der
      # Abhängigkeiten oben wurde sie bewusst übersprungen. Sie erst hier zu laden hält
      # die schnellen Schritte (Typen, Bau, Prüfungen) schnell: schlägt einer davon fehl,
      # wurden die hundert Megabyte gar nicht erst geholt.
      # Das Nachinstallationsskript des electron-Pakets holt die Binärdatei. Beim Holen
      # der Abhängigkeiten oben wurde es bewusst übersprungen; hier wird es nachgeholt.
      # Erst an dieser Stelle, damit die schnellen Schritte davor schnell bleiben:
      # scheitert einer, wurden die hundert Megabyte gar nicht erst geladen.
      - name: Electron-Binärdatei holen
        run: node node_modules/electron/install.js

      # Das Paket wirklich bauen. Alles, was sich erst am fertigen Paket zeigt - ob das
      # Programmsymbol enthalten ist, ob Prüfdateien mitgehen, ob app-update.yml stimmt -
      # sah vorher nur der Entwickler auf seinem Rechner, und auch nur, wenn er nachsah.
      #
      # Nur nsis und nur x64: es geht darum, den Inhalt zu prüfen, nicht darum, eine
      # auslieferbare Fassung zu erzeugen.
      - name: Paket bauen
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Nachsehen, was im Paket gelandet ist
        shell: bash
        run: |
          npx asar list release/win-unpacked/resources/app.asar > paketinhalt.txt
          echo "Dateien im Paket: $(wc -l < paketinhalt.txt)"
          if grep -q '\.test\.' paketinhalt.txt; then
            echo "FEHLER: Prüfdateien sind im Paket gelandet."
            grep '\.test\.' paketinhalt.txt
            exit 1
          fi
          if ! grep -q 'icon.png' paketinhalt.txt; then
            echo "FEHLER: build/icon.png fehlt im Paket - Windows-Meldungen bekämen das leere Standardsymbol."
            exit 1
          fi

          # Das Symbol muss zusätzlich ENTPACKT neben dem Archiv liegen: die Windows-Shell
          # kann nicht in eine asar-Datei hineinsehen, und sowohl die Meldungen als auch
          # das Symbol im Infobereich reichen ihr den Pfad weiter.
          if [ ! -f "release/win-unpacked/resources/app.asar.unpacked/build/icon.png" ]; then
            echo "FEHLER: build/icon.png liegt nicht entpackt neben dem Archiv (asarUnpack)."
            exit 1
          fi

          # Die Grundlage der Selbstaktualisierung. Fehlt sie, sucht die ausgelieferte
          # Anwendung nirgends nach neuen Fassungen - und zwar lautlos: es gibt keine
          # Fehlermeldung für eine Aktualisierung, die gar nicht erst versucht wird.
          # Sie liegt NEBEN dem Archiv, nicht darin, und stand deshalb in keiner Prüfung.
          if [ ! -f "release/win-unpacked/resources/app-update.yml" ]; then
            echo "FEHLER: resources/app-update.yml fehlt - die Selbstaktualisierung wäre tot."
            exit 1
          fi
          echo "--- app-update.yml ---"
          cat release/win-unpacked/resources/app-update.yml

          echo "Paketinhalt in Ordnung."

      - name: Paketinhalt aufheben
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: paketinhalt
          path: paketinhalt.txt
          if-no-files-found: ignore
