# Paketierung der Desktop-Anwendung.
#
# Gebaut wird aus dem Wurzelverzeichnis, weil die Anwendung aus vier Arbeitsbereichen
# besteht: die Electron-Hülle (desktop), der eingebettete Server, die Kernlogik und das
# Frontend. Die Abhängigkeiten in der Wurzel-package.json ("@energy-mail/server" und
# "@energy-mail/web") sind genau dafür da - electron-builder ermittelt daraus, was ins
# Paket gehört, und lässt Bauwerkzeuge wie TypeScript, Vite und Electron selbst draußen.
appId: de.energymail.desktop
productName: Energy Mail
copyright: Hendrik Zeuch

directories:
  output: release
  buildResources: build

# Woher die Anwendung ihre Aktualisierungen bezieht. Kontoname und Repository ermittelt
# electron-builder aus dem "repository"-Eintrag der package.json - deshalb steht das
# nicht doppelt hier. Beim Bauen entsteht daraus app-update.yml im Paket; danach weiß
# die ausgelieferte Anwendung selbst, wo sie nachschauen muss.
publish:
  provider: github
  # Ohne diese Zeile legt electron-builder einen Entwurf an - und Entwürfe sind für die
  # Selbstaktualisierung unsichtbar, die Anwendung fände nie etwas.
  releaseType: release

# Die Electron-Hülle liegt nicht in node_modules, sondern als Arbeitsbereich im Baum -
# deshalb hier ausdrücklich.
#
# Die Ausschlüsse gelten bewusst nur für die eigenen Pakete. Ein pauschales
# "!**/src/**" nimmt auch Fremdpaketen ihren Quellordner weg - und manche bestehen
# genau daraus: encoding-japanese verweist mit "main" auf src/index.js, wodurch die
# gepackte Anwendung beim Start abbrach, noch bevor ein Fenster erschien.
files:
  - packages/desktop/dist/**/*
  - packages/desktop/package.json
  # Das Programmsymbol wird zur Laufzeit gebraucht, nicht nur beim Verpacken: die
  # Meldungen bei neuer Post geben es ausdrücklich an. Ohne die Angabe nimmt Windows
  # das Symbol der Verknüpfung - was fehlt, wenn die portable Fassung ohne Installation
  # läuft; dann steht dort ein leeres Standardsymbol.
  - build/icon.png
  # Quellkarten braucht zur Laufzeit niemand, sie werden nie nachgeladen.
  - '!**/*.map'
  # Typangaben ebenso wenig. electron-builder wirft *.d.ts von sich aus hinaus, die
  # CommonJS-Entsprechung des Vorschaltskripts (*.d.cts) kennt es dagegen nicht.
  - '!**/*.d.cts'
  # TypeScript-Quellen der eigenen Pakete - gebaut liegt alles in dist/.
  - '!packages/*/src/**'
  - '!packages/*/tsconfig*.json'
  - '!node_modules/@energy-mail/*/src/**'
  - '!node_modules/@energy-mail/*/tsconfig*.json'
  # Übersetzte Prüfdateien. Die Ausschlüsse darüber greifen nur für src/**; die
  # Prüfungen landeten aber als dist/*.test.mjs im Paket - nachgewiesen mit
  # "asar list": 24 Dateien, darunter routen.test.mjs mit einer vollständigen
  # Serverkonfiguration samt festem Schlüssel. Der Ausschluss in den tsconfig-Dateien
  # verhindert sie bereits an der Quelle; dieser hier ist der zweite Riegel, damit ein
  # veraltetes dist/ aus einem früheren Bau nicht doch etwas mitnimmt.
  - '!**/*.test.*'

# Das Programmsymbol als echte Datei neben dem Archiv, nicht darin.
#
# Es wird zur Laufzeit von zwei Stellen gebraucht: von den Windows-Meldungen und vom
# Symbol im Infobereich. Beide reichen den Pfad an die Windows-Shell weiter, und die
# kennt das asar-Archiv nicht - sie sieht dort nur eine Datei, in die sie nicht
# hineinschauen kann. Entpackt liegt es als gewöhnliche Datei daneben und lässt sich
# von überall öffnen.
asarUnpack:
  - build/icon.png

win:
  target:
    - target: nsis
      # arm64 dazu: ohne Angabe baut electron-builder nur x64, und auf den
      # Snapdragon-Notebooks läuft die Anwendung dann in der Emulation - spürbar
      # langsamerer Start und mehr Akkuverbrauch bei einem Programm, das den ganzen Tag
      # offen ist.
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: build/icon.png

# Damit sich Energy Mail als Standard-E-Mail-Programm einstellen lässt.
#
# Ohne diesen Abschnitt kennt Windows die Anwendung gar nicht als Kandidaten: ein Klick
# auf eine mailto:-Adresse im Browser, "Senden an → E-Mail-Empfänger" im Explorer und
# ein Doppelklick auf eine .eml-Datei gingen weiterhin an Outlook oder ins Leere. Für
# ein E-Mail-Programm ist das keine Feinheit - es ist die Stelle, an der die Nutzung im
# Alltag abbricht.
protocols:
  - name: E-Mail
    schemes:
      - mailto

fileAssociations:
  - ext: eml
    name: E-Mail-Nachricht
    description: E-Mail-Nachricht
    icon: build/icon.png

# Electron-Sicherungen ("Fuses") - Schalter im ausgelieferten Binärprogramm.
#
# Ohne sie bleibt RunAsNode aktiv, und "Energy Mail.exe" lässt sich mit
# ELECTRON_RUN_AS_NODE=1 als beliebiger Node-Interpreter missbrauchen. Zusammen mit
# perMachine:false - installiert wird nach %LOCALAPPDATA%\Programs, und dort darf jeder
# Prozess im Nutzerkontext ohne Rechteerhöhung schreiben - wäre das ein bequemer Weg,
# app.asar auszutauschen und über die Hülle an safeStorage zu kommen: also genau an die
# Zugangsdaten, deren Schutz das Programm verspricht.
#
# Die Integritätsprüfung des Archivs braucht eine Codesignierung, um vollen Wert zu
# haben (siehe README, Abschnitt "Was noch fehlt"); sie ist auch ohne sie kein Schaden.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

nsis:
  # Kein Ein-Klick-Installer: der Nutzer soll sehen, wohin installiert wird, und die
  # Anwendung später normal über die Systemsteuerung wieder entfernen können.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Energy Mail
  artifactName: ${productName} Setup ${version}.${ext}

  # Deutsch. Ohne diese Angabe erscheint das Installationsprogramm auf Englisch ("Choose
  # Install Location", "Next >") - vor einer Anwendung, die durchgehend deutsch ist.
  # 1031 ist die Kennung, die Windows dafür vergibt.
  language: '1031'

  # Eigene Bilder statt der Weltkugel, die NSIS mitbringt. Erzeugt von
  # scripts/installer-grafiken.mjs; nach einer Änderung an der Marke einmal neu
  # ausführen. Das Symbol des Installationsprogramms leitet electron-builder von
  # build/icon.png ab, dafür braucht es hier keinen Eintrag.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp

  # Begrüßungsseite mit einem Wort darüber, was da installiert wird - siehe die Datei.
  # Ohne sie beginnt die Installation unmittelbar mit der Frage nach dem Zielordner.
  include: build/installer.nsh

  # Beim Entfernen nichts löschen, was der Nutzer selbst angelegt hat: Konten,
  # Signaturen und Textbausteine bleiben. Wer neu installiert, findet alles wieder vor.
  # (Ist die Vorgabe - hier ausgeschrieben, weil es eine bewusste Entscheidung ist.)
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName} ${version} portabel.${ext}
