<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Mail</title>

    <!--
      Das Programmsymbol als Vektorgrafik unmittelbar in der Adresse. Keine eigene Datei:
      so ist es schon da, bevor irgendetwas nachgeladen wurde - im Browserbetrieb steht
      damit von der ersten Sekunde an der richtige Reiter da.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7.5' fill='%232f5fd8'/><rect x='5.5' y='9.5' width='21' height='13.5' rx='2' fill='%23fff'/><path d='M6.6 10.8L16 18.4l9.4-7.6' fill='none' stroke='%231b3a86' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M23.4 6.6L16.4 18H20l-2 9 7.6-11.6H22z' fill='%23f5c518' stroke='%231b3a86' stroke-width='1.7' stroke-linejoin='round'/></svg>"
    />

    <!--
      Der Grund des Fensters, bevor irgendetwas anderes geladen ist.

      Ohne das blitzt beim Start eine weiße Fläche auf: das Stylesheet kommt erst nach
      dem ersten Zeichnen an, und bis dahin ist die Seite die Standardfarbe des Browsers.
      In der hellen Ansicht fällt das kaum auf, in der dunklen ist es ein Schlag ins
      Gesicht - und ausgerechnet dort kommt es bei jedem Start vor.

      Deshalb steht hier eine winzige Anweisung, die vor dem Zeichnen läuft, die
      gespeicherte Wahl liest und den Grund entsprechend setzt. Sie muss inline stehen
      und vor allem anderen kommen; eine nachgeladene Datei wäre schon zu spät.
    -->
    <script>
      (function () {
        try {
          var wahl = localStorage.getItem('energy-mail:thema');
          var dunkel =
            wahl === 'dunkel' ||
            ((!wahl || wahl === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.thema = dunkel ? 'dunkel' : 'hell';
        } catch (e) {
          // Ohne lesbaren Speicher bleibt es bei hell - kein Grund, den Start abzubrechen.
        }
      })();
    </script>

    <style>
      :root[data-thema='hell'] {
        --start-grund: #eaeef5;
        --start-linie: #dce2ec;
      }
      :root[data-thema='dunkel'] {
        --start-grund: #0d1117;
        --start-linie: #27313e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--start-grund);
      }

      /*
       * Startbild.
       *
       * Steht als gewöhnliches Markup in der Seite und wird von React beim ersten
       * Zeichnen ersetzt - es braucht dafür keinen Code und keine zusätzliche Anfrage.
       * Sichtbar ist es nur den Bruchteil einer Sekunde, in der die Anwendung ihre
       * Konten lädt; ohne es stünde dort eine leere Fläche, was nach einem Fehlstart
       * aussieht.
       */
      .startbild {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* Erst nach einem Moment einblenden: startet die Anwendung schnell genug,
           soll gar nichts aufblitzen. */
        animation: startbild-ein 240ms ease-out 220ms both;
      }
      @keyframes startbild-ein {
        from {
          opacity: 0;
        }
      }
      .startbild-balken {
        width: 128px;
        height: 3px;
        border-radius: 99px;
        background: var(--start-linie);
        overflow: hidden;
      }
      .startbild-balken::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f5fd8, #f5c518);
        animation: startbild-lauf 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes startbild-lauf {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startbild,
        .startbild-balken::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startbild">
        <svg viewBox="0 0 32 32" width="52" height="52" aria-hidden="true">
          <defs>
            <linearGradient id="startbild-verlauf" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a7ce6" />
              <stop offset="1" stop-color="#1c42a8" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="7.5" fill="url(#startbild-verlauf)" />
          <rect x="5.5" y="9.5" width="21" height="13.5" rx="2" fill="#fff" />
          <path
            d="M6.6 10.8 L16 18.4 L25.4 10.8"
            fill="none"
            stroke="#1b3a86"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M23.4 6.6 L16.4 18 L20 18 L18 27 L25.6 15.4 L22 15.4 Z"
            fill="#f5c518"
            stroke="#1b3a86"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
        <div class="startbild-balken"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
