<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Mail</title>

    <!--
      Was dieses Fenster überhaupt laden darf.

      Ein Mailprogramm zeigt fremdes HTML an - da gehört eine Grenze hin, die nicht
      davon abhängt, ob jede einzelne Stelle im Code richtig filtert. Electron hat
      bisher in der Konsole selbst darauf hingewiesen, dass keine gesetzt war.

      Erlaubt ist nur, was aus dem Programm selbst kommt:
        default-src 'self'   nichts von fremden Servern
        img-src            eigene Bilder, eingebettete Daten und die Anhänge, die der
                           lokale Server ausliefert (blob:)
        style-src          mit 'unsafe-inline', weil React Stilangaben unmittelbar an
                           die Elemente schreibt
        frame-src          der Nachrichtenrahmen kommt aus srcDoc, also aus 'self'
        connect-src        nur der eigene Server, auch über die WebSocket-Verbindung -
                           und zwar namentlich. Vorher stand hier "ws: wss:", und das
                           erlaubt WebSocket-Verbindungen zu JEDEM Host: genau die
                           Grenze, die nach einem Fehler anderswo noch greifen müsste,
                           war damit offen. Der Kommentar behauptete bereits das
                           Richtige, die Zeile darunter tat es nicht.
        script-src 'self'  ausdrücklich, statt es nur von default-src zu erben
        frame-ancestors    diese Seite gehört in kein fremdes Fenster
        object-src 'none'  keine eingebetteten Fremdformate
        base-uri 'none'    kein Umbiegen relativer Adressen
        form-action 'none' nichts kann irgendwohin abgeschickt werden

      Zu img-src: https: steht hier, und das ist Absicht.

      Vorher stand es nicht da - mit der Folge, dass "Einmal laden" und "Absender immer
      erlauben" wirkungslos waren. Ein srcdoc-Rahmen erbt die Richtlinie des
      Elterndokuments, also blieben die Bilder auch nach der Freigabe leer, und die
      Leiste verschwand trotzdem. Der Nutzer bekam eine Zusage, die die Anwendung nicht
      einlöste, und suchte den Fehler bei sich.

      Der Schutz liegt dort, wo er hingehört: entschaerfeExterneInhalte() nimmt jeder
      Nachricht die ladenden Adressen, BEVOR sie angezeigt wird. Erst wenn der Nutzer
      ausdrücklich freigibt, wird das unveränderte HTML gezeigt. Die Richtlinie ist hier
      der zweite Riegel, nicht der erste - und ein zweiter Riegel, der eine gewollte
      Handlung verhindert, ist keiner.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        img-src 'self' data: blob: https:;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        frame-src 'self';
        connect-src 'self' http://127.0.0.1:4000 http://localhost:4000 ws://127.0.0.1:4000 ws://localhost:4000 http://localhost:5173 ws://localhost:5173;
        object-src 'none';
        base-uri 'none';
        frame-ancestors 'none';
        form-action 'none';
      "
    />

    <!--
      Das Programmsymbol als Vektorgrafik unmittelbar in der Adresse. Keine eigene Datei:
      so ist es schon da, bevor irgendetwas nachgeladen wurde - im Browserbetrieb steht
      damit von der ersten Sekunde an der richtige Reiter da.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7.5' fill='%232f5fd8'/><rect x='5.5' y='9.5' width='21' height='13.5' rx='2' fill='%23fff'/><path d='M6.6 10.8L16 18.4l9.4-7.6' fill='none' stroke='%231b3a86' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M23.4 6.6L16.4 18H20l-2 9 7.6-11.6H22z' fill='%23f5c518' stroke='%231b3a86' stroke-width='1.7' stroke-linejoin='round'/></svg>"
    />

    <!--
      Der Grund des Fensters, bevor irgendetwas anderes geladen ist.

      Ohne das blitzt beim Start eine weiße Fläche auf: das Stylesheet kommt erst nach
      dem ersten Zeichnen an, und bis dahin ist die Seite die Standardfarbe des Browsers.
      In der hellen Ansicht fällt das kaum auf, in der dunklen ist es ein Schlag ins
      Gesicht - und ausgerechnet dort kommt es bei jedem Start vor.

      Deshalb steht hier eine winzige Anweisung, die vor dem Zeichnen läuft, die
      gespeicherte Wahl liest und den Grund entsprechend setzt. Sie muss inline stehen
      und vor allem anderen kommen; eine nachgeladene Datei wäre schon zu spät.
    -->
    <!--
      Setzt das Erscheinungsbild vor dem ersten Bild - siehe public/thema-vorab.js.
      Ohne "defer" und ohne "async": es soll das Zeichnen aufhalten, genau dafür ist es
      da. Als eigene Datei, weil das Schutzregelwerk oben keine eingebetteten Skripte
      zulässt.
    -->
    <script src="/thema-vorab.js"></script>

    <style>
      :root[data-thema='hell'] {
        --start-grund: #eaeef5;
        --start-linie: #dce2ec;
      }
      :root[data-thema='dunkel'] {
        --start-grund: #0d1117;
        --start-linie: #27313e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--start-grund);
      }

      /*
       * Startbild.
       *
       * Steht als gewöhnliches Markup in der Seite und wird von React beim ersten
       * Zeichnen ersetzt - es braucht dafür keinen Code und keine zusätzliche Anfrage.
       * Sichtbar ist es nur den Bruchteil einer Sekunde, in der die Anwendung ihre
       * Konten lädt; ohne es stünde dort eine leere Fläche, was nach einem Fehlstart
       * aussieht.
       */
      .startbild {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* Erst nach einem Moment einblenden: startet die Anwendung schnell genug,
           soll gar nichts aufblitzen. */
        animation: startbild-ein 240ms ease-out 220ms both;
      }
      @keyframes startbild-ein {
        from {
          opacity: 0;
        }
      }
      .startbild-balken {
        width: 128px;
        height: 3px;
        border-radius: 99px;
        background: var(--start-linie);
        overflow: hidden;
      }
      .startbild-balken::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f5fd8, #f5c518);
        animation: startbild-lauf 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes startbild-lauf {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startbild,
        .startbild-balken::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startbild">
        <svg viewBox="0 0 32 32" width="52" height="52" aria-hidden="true">
          <defs>
            <linearGradient id="startbild-verlauf" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a7ce6" />
              <stop offset="1" stop-color="#1c42a8" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="7.5" fill="url(#startbild-verlauf)" />
          <rect x="5.5" y="9.5" width="21" height="13.5" rx="2" fill="#fff" />
          <path
            d="M6.6 10.8 L16 18.4 L25.4 10.8"
            fill="none"
            stroke="#1b3a86"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M23.4 6.6 L16.4 18 L20 18 L18 27 L25.6 15.4 L22 15.4 Z"
            fill="#f5c518"
            stroke="#1b3a86"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
        <div class="startbild-balken"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
